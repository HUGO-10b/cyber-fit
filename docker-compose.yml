version: '3.8'

services:
  cyberfit-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberfit_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite:////app/data/cyberfit.db
      - SECRET_KEY=cyberpunk-fitness-neon-secret
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
